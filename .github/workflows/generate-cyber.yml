name: توليد محتوى وصور سيبرانية

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # قد يستغرق توليد 3 صور فنية + رفعها وقتاً أطول من الحد الافتراضي؛ نمنحه
    # هامشاً كافياً بدل فشل الوقت المستقطع منتصف التوليد.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent_runner.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          AUTO_PUBLISH: "false"
          EXTRA_PLATFORMS: "linkedin"
        run: python agent_runner.py
